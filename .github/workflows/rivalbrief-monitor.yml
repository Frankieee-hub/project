name: RivalBrief Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1,13 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: projects/rivalbrief
        run: pip install -r requirements.txt

      - name: Run competitor monitor
        working-directory: projects/rivalbrief
        run: python monitor.py

      - name: Commit updated snapshots and report
        run: |
          git config user.name "rivalbrief-bot"
          git config user.email "rivalbrief-bot@users.noreply.github.com"
          git add projects/rivalbrief/data/state.json projects/rivalbrief/data/latest.json projects/rivalbrief/data/latest-report.md
          git diff --cached --quiet && exit 0
          git commit -m "Update RivalBrief monitoring data"
          git push
