name: BidSignal Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"
  push:
    branches: ["main"]
    paths:
      - "projects/bidsignal/**"
      - ".github/workflows/bidsignal-daily.yml"
  pull_request:
    paths:
      - "projects/bidsignal/**"
      - ".github/workflows/bidsignal-daily.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static syntax check
        run: python -m py_compile projects/bidsignal/fetch_tenders.py projects/bidsignal/test_fetch_tenders.py

      - name: Unit tests
        run: python -m unittest projects/bidsignal/test_fetch_tenders.py

  fetch-and-rank:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build daily digest from live TED data
        working-directory: projects/bidsignal
        run: python fetch_tenders.py

      - name: Commit digest
        run: |
          git config user.name "bidsignal-bot"
          git config user.email "bidsignal-bot@users.noreply.github.com"
          git add projects/bidsignal/data/latest.json projects/bidsignal/data/latest.html
          git diff --cached --quiet && exit 0
          git commit -m "Update BidSignal daily digest"
          git push origin HEAD:main
