name: RivalBrief Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1,13 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/rivalbrief
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: competitor-brief-mvp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run competitor monitor
        run: python monitor.py

      - name: Commit updated snapshots and report
        run: |
          git config user.name "rivalbrief-bot"
          git config user.email "rivalbrief-bot@users.noreply.github.com"
          git add data/state.json data/latest.json data/latest-report.md
          git diff --cached --quiet && exit 0
          git commit -m "Update RivalBrief monitoring data"
          git push origin HEAD:competitor-brief-mvp
